# =============================================================================
# Prometheus Configuration for TRAVEL-WEB Monitoring
# =============================================================================
# Used in local development (docker-compose) to scrape metrics from the
# Next.js application, PostgreSQL exporter, Loki, and container runtime.
# =============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: "travel-web-monitor"
    environment: "development"

# Alertmanager configuration (enable when alerting rules are ready)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']

# Rule files for alerting
# rule_files:
#   - "alerts/*.yml"

scrape_configs:
  # -----------------------------------------------------------------
  # Prometheus self-monitoring
  # -----------------------------------------------------------------
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          service: "prometheus"

  # -----------------------------------------------------------------
  # TRAVEL-WEB Next.js application metrics (port 3000)
  # Expects /api/metrics endpoint exposing prom-client data
  # -----------------------------------------------------------------
  - job_name: "travel-web-nextjs"
    scrape_interval: 10s
    metrics_path: "/api/metrics"
    static_configs:
      - targets: ["travel-web:3000"]
        labels:
          service: "travel-web"
          component: "nextjs"
          framework: "nextjs"

  # -----------------------------------------------------------------
  # PostgreSQL Exporter
  # -----------------------------------------------------------------
  - job_name: "postgres-exporter"
    scrape_interval: 15s
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          service: "postgres-exporter"
          component: "database"

  # -----------------------------------------------------------------
  # Loki metrics (self-monitoring)
  # -----------------------------------------------------------------
  - job_name: "loki"
    scrape_interval: 15s
    static_configs:
      - targets: ["loki:3100"]
        labels:
          service: "loki"
          component: "log-aggregation"

  # -----------------------------------------------------------------
  # cAdvisor — container metrics
  # -----------------------------------------------------------------
  - job_name: "cadvisor"
    scrape_interval: 10s
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          service: "cadvisor"
          component: "container-monitoring"

  # -----------------------------------------------------------------
  # Node Exporter — host system metrics (optional)
  # -----------------------------------------------------------------
  # - job_name: "node-exporter"
  #   static_configs:
  #     - targets: ["node-exporter:9100"]
  #       labels:
  #         service: "node-exporter"
  #         component: "system-metrics"
