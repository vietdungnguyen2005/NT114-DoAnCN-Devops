# =============================================================================
# Loki Helm Values — TRAVEL-WEB Log Aggregation on EKS
# =============================================================================
# Install:
#   helm repo add grafana https://grafana.github.io/helm-charts
#   helm repo update
#   helm install loki grafana/loki \
#     --namespace monitoring --create-namespace \
#     -f k8s-manifests/monitoring/loki-values.yaml \
#     --wait --timeout 10m
# =============================================================================

# ---------------------------------------------------------------------------
# Deployment mode: SingleBinary for small/medium workloads
# Switch to "distributed" for production scale
# ---------------------------------------------------------------------------
deploymentMode: SingleBinary

loki:
  auth_enabled: false

  # Schema configuration
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  # Storage — S3 backend for durability
  storage:
    type: s3
    s3:
      region: ap-southeast-1
      bucketnames: travel-web-loki-logs
      # Uses IRSA for authentication (no static credentials)
      # Ensure the ServiceAccount has the correct IAM role annotation
    bucketNames:
      chunks: travel-web-loki-logs
      ruler: travel-web-loki-logs

  # Ingestion and query limits
  limits_config:
    retention_period: 168h                # 7 days
    reject_old_samples: true
    reject_old_samples_max_age: 168h
    max_cache_freshness_per_query: 10m
    split_queries_by_interval: 15m
    ingestion_rate_mb: 10
    ingestion_burst_size_mb: 20
    per_stream_rate_limit: 5MB
    per_stream_rate_limit_burst: 15MB
    max_query_series: 500
    max_entries_limit_per_query: 5000

  # Compactor for retention enforcement
  compactor:
    working_directory: /loki/compactor
    retention_enabled: true
    retention_delete_delay: 2h
    compaction_interval: 10m

  # Common config
  commonConfig:
    replication_factor: 1

  # Analytics
  analytics:
    reporting_enabled: false

# ---------------------------------------------------------------------------
# Single Binary mode resources
# ---------------------------------------------------------------------------
singleBinary:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
  persistence:
    enabled: true
    storageClass: gp3
    size: 10Gi

# ---------------------------------------------------------------------------
# Service Account — annotate with IRSA role for S3 access
# ---------------------------------------------------------------------------
serviceAccount:
  create: true
  name: loki
  annotations:
    # Replace with your actual IAM role ARN
    eks.amazonaws.com/role-arn: "arn:aws:iam::role/travel-web-loki-s3-role"

# ---------------------------------------------------------------------------
# Gateway (nginx) — provides unified entrypoint
# ---------------------------------------------------------------------------
gateway:
  enabled: true
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# ---------------------------------------------------------------------------
# Monitoring — expose Loki metrics for Prometheus
# ---------------------------------------------------------------------------
monitoring:
  selfMonitoring:
    enabled: false
    grafanaAgent:
      installOperator: false
  serviceMonitor:
    enabled: true
    labels:
      release: monitoring

# ---------------------------------------------------------------------------
# Disable components not needed in SingleBinary mode
# ---------------------------------------------------------------------------
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

# ---------------------------------------------------------------------------
# Chunk cache — embedded for small deployments
# ---------------------------------------------------------------------------
chunksCache:
  enabled: false
resultsCache:
  enabled: false
