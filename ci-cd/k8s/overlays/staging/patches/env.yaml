# Staging environment variable overrides
apiVersion: apps/v1
kind: Deployment
metadata:
  name: travel-web
spec:
  template:
    spec:
      containers:
        - name: travel-web
          env:
            # Secrets from AWS Secrets Manager (via External Secrets Operator)
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: travel-web-secrets
                  key: DATABASE_URL
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: travel-web-secrets
                  key: NEXTAUTH_SECRET
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: travel-web-secrets
                  key: STRIPE_SECRET_KEY
            # Staging-specific environment variables
            - name: NEXTAUTH_URL
              value: "https://staging.travel-web.example.com"
            - name: NEXT_PUBLIC_APP_URL
              value: "https://staging.travel-web.example.com"
            - name: NODE_ENV
              value: "production"
