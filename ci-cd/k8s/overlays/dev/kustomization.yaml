apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: travel-web-dev
resources:
  - ../../base

namePrefix: dev-

patches:
  - path: patches/resources.yaml
  - path: patches/env.yaml

# Không set replicas ở đây — để HPA quản lý (minReplicas: 2)

images:
  - name: travel-web-app
    newName: 443014729163.dkr.ecr.ap-southeast-1.amazonaws.com/travel-web-app
    newTag: latest

labels:
  - pairs:
      environment: development

configMapGenerator:
  - name: app-config
    literals:
      - ENVIRONMENT=development
      - DEBUG=true
