# =============================================================
# Deployments for Travel-Web Microservices
# =============================================================

# --- API Gateway ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels:
    app: api-gateway
    component: gateway
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: api-gateway
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: api-gateway
        component: gateway
    spec:
      containers:
        - name: api-gateway
          image: api-gateway
          imagePullPolicy: Always
          ports:
            - containerPort: 4000
              protocol: TCP
          env:
            - name: PORT
              value: "4000"
            - name: NODE_ENV
              value: "production"
            - name: TRUST_PROXY
              value: "1"
            - name: AUTH_SERVICE_URL
              value: "http://auth-service:3001"
            - name: BOOKING_SERVICE_URL
              value: "http://booking-service:3002"
            - name: ROOM_SERVICE_URL
              value: "http://room-service:3003"
            - name: PAYMENT_SERVICE_URL
              value: "http://payment-service:3004"
            - name: REVIEW_SERVICE_URL
              value: "http://review-service:3005"
            - name: NOTIFICATION_SERVICE_URL
              value: "http://notification-service:3006"
            - name: CONTENT_SERVICE_URL
              value: "http://content-service:3007"
            - name: BLOG_SERVICE_URL
              value: "http://blog-service:3008"
            - name: REDIS_URL
              value: "redis://redis:6379"
            - name: SERVICE_DISCOVERY_MODE
              value: "static"
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 20
          startupProbe:
            httpGet:
              path: /healthz
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30

---
# --- Auth Service ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  labels:
    app: auth-service
    component: service
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: auth-service
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: auth-service
        component: service
    spec:
      containers:
        - name: auth-service
          image: auth-service
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
              protocol: TCP
          env:
            - name: PORT
              value: "3001"
            - name: NODE_ENV
              value: "production"
            - name: AUTH_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: travel-web-secrets
                  key: AUTH_DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: travel-web-secrets
                  key: JWT_SECRET
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 20

