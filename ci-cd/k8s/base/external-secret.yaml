apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: travel-web-secret-store
  labels:
    app: travel-web
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-southeast-1
      auth:
        jwt:
          serviceAccountRef:
            name: travel-web-sa

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: travel-web-external-secret
  labels:
    app: travel-web
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: travel-web-secret-store
    kind: SecretStore
  target:
    name: travel-web-secrets
    creationPolicy: Owner
  data:
    # --- Database URLs (per service) ---
    - secretKey: AUTH_DATABASE_URL
      remoteRef:
        key: travel-web/secrets
        property: AUTH_DATABASE_URL
    - secretKey: BOOKING_DATABASE_URL
      remoteRef:
        key: travel-web/secrets
        property: BOOKING_DATABASE_URL
    - secretKey: ROOM_DATABASE_URL
      remoteRef:
        key: travel-web/secrets
        property: ROOM_DATABASE_URL
    - secretKey: PAYMENT_DATABASE_URL
      remoteRef:
        key: travel-web/secrets
        property: PAYMENT_DATABASE_URL
    - secretKey: REVIEW_DATABASE_URL
      remoteRef:
        key: travel-web/secrets
        property: REVIEW_DATABASE_URL
    - secretKey: NOTIFICATION_DATABASE_URL
      remoteRef:
        key: travel-web/secrets
        property: NOTIFICATION_DATABASE_URL
    - secretKey: CONTENT_DATABASE_URL
      remoteRef:
        key: travel-web/secrets
        property: CONTENT_DATABASE_URL
    - secretKey: BLOG_DATABASE_URL
      remoteRef:
        key: travel-web/secrets
        property: BLOG_DATABASE_URL
    # --- Shared secrets ---
    - secretKey: JWT_SECRET
      remoteRef:
        key: travel-web/secrets
        property: JWT_SECRET
    - secretKey: RABBITMQ_URL
      remoteRef:
        key: travel-web/secrets
        property: RABBITMQ_URL
    - secretKey: RABBITMQ_USER
      remoteRef:
        key: travel-web/secrets
        property: RABBITMQ_USER
    - secretKey: RABBITMQ_PASSWORD
      remoteRef:
        key: travel-web/secrets
        property: RABBITMQ_PASSWORD
    # --- Payment secrets ---
    - secretKey: VNP_TMN_CODE
      remoteRef:
        key: travel-web/secrets
        property: VNP_TMN_CODE
    - secretKey: VNP_HASH_SECRET
      remoteRef:
        key: travel-web/secrets
        property: VNP_HASH_SECRET
    # --- Notification secrets ---
    - secretKey: EMAIL_FROM
      remoteRef:
        key: travel-web/secrets
        property: EMAIL_FROM
    - secretKey: SENDGRID_API_KEY
      remoteRef:
        key: travel-web/secrets
        property: SENDGRID_API_KEY

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: travel-web-sa
  labels:
    app: travel-web
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::443014729163:role/travel-web-secrets-reader
