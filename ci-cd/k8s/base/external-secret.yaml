apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: travel-web-secret-store
  labels:
    app: travel-web
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-southeast-1
      auth:
        jwt:
          serviceAccountRef:
            name: travel-web-sa

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: travel-web-external-secret
  labels:
    app: travel-web
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: travel-web-secret-store
    kind: SecretStore
  target:
    name: travel-web-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: travel-web/secrets
        property: DATABASE_URL
    - secretKey: NEXTAUTH_SECRET
      remoteRef:
        key: travel-web/secrets
        property: NEXTAUTH_SECRET
    - secretKey: STRIPE_SECRET_KEY
      remoteRef:
        key: travel-web/secrets
        property: STRIPE_SECRET_KEY

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: travel-web-sa
  labels:
    app: travel-web
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::443014729163:role/travel-web-secrets-role
