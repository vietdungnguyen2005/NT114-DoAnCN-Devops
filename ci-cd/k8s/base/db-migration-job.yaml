# =============================================================
# Database Migration Jobs — Per-service Prisma migrations
# Runs as ArgoCD PreSync hook before deployments
# =============================================================

# --- Auth Service Migration ---
apiVersion: batch/v1
kind: Job
metadata:
  name: auth-db-migrate
  labels:
    app: auth-service
    component: db-migration
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app: auth-service
        component: db-migration
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: auth-service
          imagePullPolicy: Always
          command: ["npx", "prisma", "migrate", "deploy", "--schema=./services/auth-service/prisma/schema.prisma"]
          workingDir: /app
          env:
            - name: AUTH_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: travel-web-secrets
                  key: AUTH_DATABASE_URL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi

