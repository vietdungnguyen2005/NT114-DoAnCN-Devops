apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: travel-web-ingress
  labels:
    app: travel-web
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: travel-web
                port:
                  number: 80
