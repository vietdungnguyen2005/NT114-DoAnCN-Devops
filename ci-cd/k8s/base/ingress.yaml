# =============================================================
# Ingress — Routes all traffic to API Gateway
# =============================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: travel-web-ingress
  labels:
    app: travel-web
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          # All API traffic → API Gateway
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 4000
          # Health/metrics endpoints
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 4000
          # Upload files served by auth-service via gateway
          - path: /uploads
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 4000
          # Default catch-all → API Gateway
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 4000
