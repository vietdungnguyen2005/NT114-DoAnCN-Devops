# =============================================================
# SonarCloud Configuration for TRAVEL-WEB (Microservice / TypeScript)
# =============================================================

# Project identification
sonar.organization=vietdungnguyen2005
sonar.projectKey=vietdungnguyen2005_NT114-DoAnCN-Devops
sonar.projectName=TRAVEL-WEB-Microservices
sonar.projectVersion=2.0.0

# SonarCloud server
sonar.host.url=https://sonarcloud.io

# ---- Source Configuration ----
# Scan all microservices + shared packages
sonar.sources=\
  web/TRAVEL-WEB/services/api-gateway/src,\
  web/TRAVEL-WEB/services/auth-service/src,\
  web/TRAVEL-WEB/services/booking-service/src,\
  web/TRAVEL-WEB/services/room-service/src,\
  web/TRAVEL-WEB/services/payment-service/src,\
  web/TRAVEL-WEB/services/review-service/src,\
  web/TRAVEL-WEB/services/notification-service/src,\
  web/TRAVEL-WEB/services/content-service/src,\
  web/TRAVEL-WEB/services/blog-service/src,\
  web/TRAVEL-WEB/packages/contracts/src,\
  web/TRAVEL-WEB/packages/shared/src

sonar.tests=web/TRAVEL-WEB/services
sonar.test.inclusions=**/__tests__/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Language & encoding
sonar.language=ts
sonar.sourceEncoding=UTF-8

# TypeScript / JavaScript analysis
sonar.typescript.lcov.reportPaths=web/TRAVEL-WEB/coverage/lcov.info
sonar.javascript.lcov.reportPaths=web/TRAVEL-WEB/coverage/lcov.info

# ---- Exclusions ----
# Files to exclude from analysis
sonar.exclusions=\
  **/node_modules/**,\
  **/.next/**,\
  **/out/**,\
  **/build/**,\
  **/coverage/**,\
  **/public/**,\
  **/*.config.js,\
  **/*.config.ts,\
  **/*.config.mjs,\
  **/prisma/migrations/**,\
  **/*.d.ts,\
  **/jest.setup.js

# Files to exclude from coverage analysis
sonar.coverage.exclusions=\
  **/__tests__/**,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  **/prisma/**,\
  **/types/**,\
  **/*.d.ts,\
  **/middleware.ts

# Files to exclude from duplication analysis
sonar.cpd.exclusions=\
  **/__tests__/**,\
  **/*.test.ts,\
  **/*.test.tsx

# ---- Quality Gate ----
# SonarCloud will use the default quality gate unless overridden
# Recommended: Sonar way quality gate

# ---- SCM ----
sonar.scm.provider=git
sonar.scm.forceReloadAll=false
