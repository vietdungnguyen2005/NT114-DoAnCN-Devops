apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: travel-web-staging
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    environment: staging
    app: travel-web
  annotations:
    # Notification on sync success/failure
    notifications.argoproj.io/subscribe.on-sync-succeeded.slack: travel-web-alerts
    notifications.argoproj.io/subscribe.on-sync-failed.slack: travel-web-alerts
spec:
  project: default

  source:
    repoURL: https://github.com/vietdungnguyen2005/NT114-DoAnCN-Devops.git
    targetRevision: test  # Track test branch for staging
    path: ci-cd/k8s/overlays/staging

  destination:
    server: https://kubernetes.default.svc
    namespace: travel-web-staging

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - PrunePropagationPolicy=foreground
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  revisionHistoryLimit: 10

  ignoreDifferences:
    - group: argoproj.io
      kind: Rollout
      jsonPointers:
        - /spec/replicas

  # Staging-specific: run smoke tests after sync via PostSync hook
  # The smoke test job is defined as a resource hook in the overlay
  info:
    - name: smokeTest
      value: "enabled"
